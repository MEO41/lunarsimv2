# @package _global_
# S5 phase 1: terrain-relative navigation from the high gate to the low gate (scenario catalogue
# S5), float64 local plant over the Apollo 17 terrain (regional 8 m grid out to 10 km for the
# camera and the TRN map). Run through scripts/run_mission.py mission=s5_trn.
defaults:
  - /start: high_gate
  - /plant: local_f64
  - /surface: apollo17_taurus_littrow
  - /sensors: trn_suite
  - /faults: none
  - /nav: trn_ekf
  - /agent: quadratic_guidance_approach
  - /actuators: engine_rcs_pulse
  - /metrics: phase_gate
  - /training: none
  - /landers@lander: apollo_lunar_module
  - _self_
name: s5_trn_descent
seed: 0
start:
  nav_error:                   # model choice: about the error that the braking phase leaves
    position_m: 50.0
    velocity_mps: 0.5
    attitude_deg: 0.1
surface:
  regional_half_size_m: 10000.0
  regional_cell_size_m: 8.0
agent:
  frame: SITE
  ignite_within_deg: 60.0      # the engine burns on from braking: thrust while the attitude turns
actuators:
  initial_throttle: 0.5
nav:
  initial_sigma:
    position_m: 50.0
    velocity_mps: 0.5
metrics:
  until:
    altitude_below_m: 152.4    # low gate: 500 ft ([D-6846] p. 10) ...
    range_below_m: 609.6       # ... or 2,000 ft from the site, whichever comes first
  maximum_elapsed_s: 200.0
env:
  num_envs: 16
  env_spacing_m: 1.0
  physics_step_s: 0.025
  physics_steps_per_control_step: 4
  episode_length_s: 300.0
# Mass at the high gate: the S6 low-gate mass times exp(dv / ve) for the approach phase's 801 ft/s
# ([D-6846] Table I: 6,176 - 5,375 fps).
lander:
  mass:
    mass_at_start_kg:
      value: 8450.6
      source: "derived: 7,788.2 kg at low gate (s6_hazard_avoidance) x exp(801 ft/s [D-6846] Table I / (305 s [D-7143] x g0))"
    descent_propellant_at_start_kg:
      value: 1472.9
      source: "derived: 810.5 kg at low gate (s6_hazard_avoidance) plus the 662.4 kg the approach phase burns"
  descent_engine:
    maximum_throttle_fraction:
      value: 0.925
      source: "[D-6846] p. 4 and [D-7143] p. 6-8: fixed throttle point 92.5 % of design thrust"
