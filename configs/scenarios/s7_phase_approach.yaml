# @package _global_
# S7 phase 3: approach (P64) from the high gate to the low gate, in MCMF.
# (Written out in full, not inherited from the braking phase, so its gate replaces braking's.)
defaults:
  - /start: from_log
  - /plant: orbit_f64
  - /surface: flat
  - /sensors: none
  - /faults: none
  - /nav: truth_noise
  - /agent: quadratic_guidance_approach
  - /actuators: engine_rcs_pulse
  - /metrics: phase_gate
  - /training: none
  - /landers@lander: apollo_lunar_module
  - _self_
name: s7_phase_approach
seed: 0
plant:
  frame: MCMF
actuators:
  initial_throttle: 0.5          # the descent engine burns on from braking ([D-6846] p. 7: one burn from PDI to touchdown)
agent:
  ignite_within_deg: 60.0        # the engine is already burning: thrust while the attitude turns
nav:
  vertical_position_bias_m: 5.0  # model choice: the landing radar has updated the altitude since 39,000 ft ([D-6846] Table I)
metrics:
  until:
    altitude_below_m: 152.4      # low gate: 500 ft ([D-6846] p. 10) ...
    range_below_m: 609.6         # ... or 2,000 ft from the site, whichever comes first
  maximum_elapsed_s: 300.0
env:
  num_envs: 16
  env_spacing_m: 30.0
  physics_step_s: 0.025
  physics_steps_per_control_step: 4
  episode_length_s: 400.0
# Mass and throttle at descent orbit insertion (derived; sources below).
lander:
  mass:
    mass_at_start_kg:
      value: 14721.0
      source: "derived: 7,327 kg at touchdown [A11-MR] x exp((6,775 ft/s PDI-to-touchdown [D-6846] Table I + 21.8 m/s DOI) / (305 s [D-7143] x g0))"
    descent_propellant_at_start_kg:
      value: 7743.3
      source: "derived: 349.3 kg left at cutoff [A11-MR] + 7,394 kg burned from DOI to touchdown (rocket equation above); Table II of [D-6846] lists 7,693 kg (16,960.9 lb) nominal for the powered descent"
  descent_engine:
    maximum_throttle_fraction:
      value: 0.925
      source: "[D-6846] p. 4 and [D-7143] p. 6-8: the fixed throttle point is 92.5 % of design thrust; the guidance commands either 10-60 % or this point, never the 65-92.5 % non-operating region"
