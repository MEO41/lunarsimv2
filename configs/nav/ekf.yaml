binding: ekf
# Error-state Kalman filter (src/lunarsim/slots/navigation/ekf.py). The filter's noise model is
# the sensor model of configs/sensors/terminal_suite.yaml; a filter that knows its sensors.
initial_sigma:
  position_m: 1.0                    # design S2: first-estimate position error 1.0 m
  velocity_mps: 0.2                  # design S2: first-estimate velocity error 0.2 m/s
  attitude_deg: 0.1                  # model choice (equals start.nav_error.attitude_deg in S2)
  accelerometer_bias_micro_g: 300.0  # LN-200S bias repeatability
  gyro_bias_deg_per_h: 1.0           # LN-200S bias repeatability
process_noise:
  accelerometer_noise_micro_g_per_sqrt_hz: 35.0   # LN-200S
  angle_random_walk_deg_per_sqrt_h: 0.07          # LN-200S
  accelerometer_bias_random_walk_mps2_per_sqrt_s: 1.0e-5  # model choice (the IMU model has constant biases)
  gyro_bias_random_walk_deg_per_h_per_sqrt_s: 0.01        # model choice
