binding: analytic_point_mass
# Point mass, thrust along the commanded direction, no legs (transfer-study test T8).
# Needs metrics.end_at_first_contact=true and PPO training with ppo_mlp in attitude_commands mode.
# 0: the attitude follows the command at once (option A). > 0: first-order lag of the thrust axis
# towards the command, in s (option B); T8 uses 1.3 s, measured on the rigid-body lander with the
# classical attitude controller (scripts/measure_attitude_time_constant.py, 2 and 5 deg steps).
attitude_time_constant_s: 0.0
# What the plant reports as the body rate (the policy observes it; the touchdown metric judges it as
# the tilt rate). physical (T8): zero at once, the turn rate with a lag. zero: always zero (a lag
# without a rate). held_turn_rate: the latest attitude change over held_turn_rate_period_s, held
# until the next turn (an attitude at once with a rate). Observation-channel control, simulated
# review item R20 (2026-11-25).
body_rate_report: physical
# One policy decision: 5 control steps x 4 physics substeps x 5 ms (configs/agent/ppo_mlp.yaml).
held_turn_rate_period_s: 0.1
